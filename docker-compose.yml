services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: desafio-postgres
    environment:
      POSTGRES_USER: desafio_user
      POSTGRES_PASSWORD: desafio_password
      POSTGRES_DB: desafio_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: